name: Deploy

on:
  push:
    branches:
      - stag
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'stag' && 'staging' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Build application
        run: bun run build

      - name: Build container image
        run: docker build --tag "${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" .

