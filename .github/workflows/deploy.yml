name: Deploy

on:
  push:
    branches:
      - stag
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'stag' && 'staging' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build application
        run: bun run build

      - name: Build container image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Apply runtime secret
        env:
          NAMESPACE: ${{ github.ref_name == 'stag' && vars.K8S_NAMESPACE_STAG || vars.K8S_NAMESPACE_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          : "${JWT_SECRET:?JWT_SECRET secret is required}"
          : "${POSTGRES_HOST:?POSTGRES_HOST secret is required}"
          : "${POSTGRES_PORT:?POSTGRES_PORT secret is required}"
          : "${POSTGRES_DB:?POSTGRES_DB secret is required}"
          : "${POSTGRES_USER:?POSTGRES_USER secret is required}"
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is required}"

          secret_file="$(mktemp)"
          {
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'POSTGRES_HOST=%s\n' "$POSTGRES_HOST"
            printf 'POSTGRES_PORT=%s\n' "$POSTGRES_PORT"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
          } > "$secret_file"

          kubectl -n "$NAMESPACE" create secret generic workshop-app-secret \
            --from-env-file="$secret_file" \
            --dry-run=client \
            -o yaml | kubectl -n "$NAMESPACE" apply -f -

          rm -f "$secret_file"

      - name: Deploy Kubernetes manifests
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          OVERLAY: ${{ github.ref_name == 'stag' && 'stag' || 'prod' }}
          NAMESPACE: ${{ github.ref_name == 'stag' && vars.K8S_NAMESPACE_STAG || vars.K8S_NAMESPACE_PROD }}
        run: |
          kubectl -n "$NAMESPACE" delete job workshop-app-migrations --ignore-not-found=true
          kubectl kustomize "k8s/overlays/$OVERLAY/migrations" > /tmp/workshop-app-migrations.yaml
          sed -i "s#image: workshop-app:latest#image: $IMAGE_URI#g" /tmp/workshop-app-migrations.yaml
          kubectl -n "$NAMESPACE" apply -f /tmp/workshop-app-migrations.yaml
          if ! kubectl -n "$NAMESPACE" wait --for=condition=complete job/workshop-app-migrations --timeout=180s; then
            echo "=== Migration job failed or timed out ==="
            echo "--- Job status ---"
            kubectl -n "$NAMESPACE" get job workshop-app-migrations -o yaml
            echo "--- Pod status ---"
            kubectl -n "$NAMESPACE" get pods -l job-name=workshop-app-migrations -o wide
            echo "--- Pod describe ---"
            kubectl -n "$NAMESPACE" describe pods -l job-name=workshop-app-migrations
            echo "--- Pod logs ---"
            kubectl -n "$NAMESPACE" logs -l job-name=workshop-app-migrations --tail=100 --all-containers || true
            exit 1
          fi

          kubectl kustomize "k8s/overlays/$OVERLAY" > /tmp/workshop-app.yaml
          sed -i "s#image: workshop-app:latest#image: $IMAGE_URI#g" /tmp/workshop-app.yaml
          kubectl -n "$NAMESPACE" apply -f /tmp/workshop-app.yaml
          kubectl -n "$NAMESPACE" rollout status deployment/workshop-app --timeout=180s
