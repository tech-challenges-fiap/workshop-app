name: PR Validation

on:
  pull_request:
    branches:
      - stag
      - prod

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Lint
        run: bun run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Test
        run: bun test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Build
        run: bun run build

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag workshop-app:pr .

  k8s:
    name: k8s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/overlays/stag >/tmp/workshop-app-stag.yaml
          kubectl kustomize k8s/overlays/stag/migrations >/tmp/workshop-app-stag-migrations.yaml
          kubectl kustomize k8s/overlays/prod >/tmp/workshop-app-prod.yaml
          kubectl kustomize k8s/overlays/prod/migrations >/tmp/workshop-app-prod-migrations.yaml
