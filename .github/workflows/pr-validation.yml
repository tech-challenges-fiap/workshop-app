name: PR Validation

on:
  pull_request:
    branches:
      - stag
      - prod

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workshop_user
          POSTGRES_PASSWORD: workshop_password
          POSTGRES_DB: workshop_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop_user -d workshop_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: workshop_user
      POSTGRES_PASSWORD: workshop_password
      POSTGRES_DB_TEST: workshop_db_test
      JWT_SECRET: test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:coverage

      - name: Sonar
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag workshop-app:pr .

  k8s:
    name: k8s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/overlays/stag >/tmp/workshop-app-stag.yaml
          kubectl kustomize k8s/overlays/stag/migrations >/tmp/workshop-app-stag-migrations.yaml
          kubectl kustomize k8s/overlays/prod >/tmp/workshop-app-prod.yaml
          kubectl kustomize k8s/overlays/prod/migrations >/tmp/workshop-app-prod-migrations.yaml
