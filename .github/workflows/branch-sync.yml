name: Prod/Stag Sync

on:
  push:
    branches:
      - prod
      - stag
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  branch-sync:
    name: prod and stag synced
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch origin prod stag --no-tags

      - name: Check prod and stag content
        run: |
          set -euo pipefail

          prod_sha="$(git rev-parse origin/prod)"
          stag_sha="$(git rev-parse origin/stag)"
          prod_only_commit_count="$(git rev-list --count origin/stag..origin/prod)"
          stag_only_commit_count="$(git rev-list --count origin/prod..origin/stag)"

          echo "prod: ${prod_sha}"
          echo "stag: ${stag_sha}"
          echo "prod-only commits: ${prod_only_commit_count}"
          echo "stag-only commits: ${stag_only_commit_count}"

          if git diff --quiet origin/prod origin/stag -- .; then
            echo "prod and stag have identical content."
            exit 0
          fi

          echo "::error title=Prod/Stag out of sync::prod and stag have different repository content."
          git diff --stat origin/prod origin/stag -- .
          exit 1
