name: Bug report
description: Reportar defeito na API principal.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Resumo
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto
      description: Liste as rotas, contratos ou ambientes afetados.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
    validations:
      required: true

