openapi: 3.0.3
info:
  title: Workshop App — Internal HTTP API
  version: 1.0.0
  description: |
    Internal HTTP API for the `workshop-app` service.

    In production this service runs inside Kubernetes (EKS) and is accessed exclusively through
    `workshop-edge` (AWS HTTP API Gateway), which:
    - Issues JWT tokens via CPF-based authentication (`POST /auth/login` on the edge)
    - Proxies all other requests to this service under the `/api/` path prefix (stripped before forwarding)

    JWT tokens are HS256-signed and issued by `workshop-edge`, not by this service.
    The legacy `POST /auth/login` (username/password) on this service is disabled in production.

    For the external-facing public API, refer to the `workshop-edge` OpenAPI specification.
servers:
  - url: /
    description: Internal service URL (direct access, without /api prefix)

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Healthy server
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      tags:
        - Auth
      deprecated: true
      summary: Legacy admin login (username/password)
      description: |
        Legacy authentication endpoint — disabled in production.
        In production, JWT tokens are issued exclusively by `workshop-edge` via CPF-based
        authentication (`POST /auth/login` on the edge service).
        This route may be used for local development only.
      operationId: loginAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
            example:
              username: admin
              password: change-me
      responses:
        "200":
          description: JWT token generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "400":
          description: Body validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedErrorResponse"

