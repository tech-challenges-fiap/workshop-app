      summary: List work orders
      description: |
        Returns the operational queue for workshop execution.
        Includes only `IN_EXECUTION`, `WAITING_APPROVAL`, `DIAGNOSIS`, and `RECEIVED`.
        Results are ordered by status priority, then oldest `updatedAt`, then ascending `id`.
      operationId: listWorkOrders
      responses:
        "200":
          description: List of work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrder"
              examples:
                operationalQueue:
                  summary: Queue ordered by operational priority
                  value:
                    - id: 23
                      vehicleId: 11
                      status: IN_EXECUTION
                      totalAmount: 520
                      publicToken: 5adf8240-af31-4f72-8b88-a7fd5f5f45bb
                      publicTokenExpiresAt: "2099-01-10T12:00:00.000Z"
                      createdAt: "2024-01-10T09:20:00.000Z"
                      updatedAt: "2024-01-10T11:00:00.000Z"
