  /webhooks/work-orders/events:
    post:
      tags:
        - Webhooks
      summary: Receive external work-order events
      description: |
        Unified inbound webhook for approval, rejection, and status-update events.
        This endpoint is intentionally unauthenticated in MVP and applies strict payload validation.
        Duplicate `eventId` values are idempotent and return a duplicate result without replaying side effects.
      operationId: handleExternalWorkOrderEvent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalWebhookWorkOrderEventRequest"
            examples:
              serviceTaskApproved:
                summary: Approve service task
                value:
                  eventId: evt-approve-1
                  eventType: SERVICE_TASK_APPROVED
                  workOrderId: 10
                  serviceTaskId: 21
                  occurredAt: "2024-01-10T10:00:00.000Z"
              serviceTaskRejected:
                summary: Reject service task
                value:
                  eventId: evt-reject-1
                  eventType: SERVICE_TASK_REJECTED
                  workOrderId: 10
                  serviceTaskId: 22
                  occurredAt: "2024-01-10T10:05:00.000Z"
              statusUpdated:
                summary: Advance work order to diagnosis
                value:
                  eventId: evt-status-1
                  eventType: WORK_ORDER_STATUS_UPDATED
                  workOrderId: 10
                  targetStatus: DIAGNOSIS
                  occurredAt: "2024-01-10T11:00:00.000Z"
      responses:
        "200":
          description: Event processed or recognized as duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalWebhookWorkOrderEventResponse"
              examples:
                processed:
                  summary: New event applied
                  value:
                    eventId: evt-approve-1
                    eventType: SERVICE_TASK_APPROVED
                    result: processed
                duplicate:
                  summary: Duplicate event id ignored
                  value:
                    eventId: evt-approve-1
                    eventType: SERVICE_TASK_APPROVED
                    result: duplicate
        "400":
          description: Invalid payload or invalid event data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                missingRequiredField:
                  summary: Invalid request body
                  value:
                    error: ValidationError
                    message: Invalid input
                    details:
                      - path:
                          - serviceTaskId
                        message: Invalid input
                        code: invalid_type
                missingServiceTaskIdForTransition:
                  summary: Invalid event for target transition
                  value:
                    error: ValidationError
                    message: "serviceTaskId is required for WORK_ORDER_STATUS_UPDATED to IN_EXECUTION"
                    details: []
        "404":
          description: Referenced work order or service task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
              examples:
                workOrderNotFound:
                  summary: Target resource does not exist
                  value:
                    error: WorkOrderNotFound
                    message: Work order with id 999 was not found
        "409":
          description: Invalid status transition or stock conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
              examples:
                transitionNotAllowed:
                  summary: Requested transition conflicts with current status
                  value:
                    error: WorkOrderStatusTransitionNotAllowed
                    message: Transition from RECEIVED to DELIVERED is not allowed
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedErrorResponse"
              examples:
                unexpected:
                  summary: Unexpected processing failure
                  value:
                    error: UnexpectedError
                    message: Unexpected error

