    post:
      tags:
        - Work Orders
      summary: Create work order
      description: |
        Opens a work order using the full payload contract (`customer`, `vehicle`, `parts`, `services`).
        This endpoint returns `409` for uniqueness conflicts on customer document, vehicle plate, or part SKU.
      operationId: createWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkOrderRequest"
            examples:
              fullPayload:
                summary: Full opening payload
                value:
                  customer:
                    name: Maria Souza
                    document: "16899535009"
                    phone: "+5511988887777"
                    email: maria.souza@example.com
                    role: customer
                  vehicle:
                    plate: FUL-9123
                    brand: Toyota
                    model: Corolla
                    year: 2021
                  parts:
                    - sku: SKU-FULL-DB-1
                      name: Air Filter
                      quantity: 8
                      price: 40
                  services:
                    - name: Revision
                      estimatedTime: 120
                      price: 300
                      requiredParts:
                        - sku: SKU-FULL-DB-1
                          quantity: 1
      responses:
        "201":
          description: Work order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          description: Body validation error or invalid payload references
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/DomainErrorResponse"
              examples:
                validationError:
                  summary: Structural body validation failure
                  value:
                    error: ValidationError
                    details:
                      - path:
                          - services
                        message: "Too small: expected array to have >=1 items"
                        code: too_small
                payloadValidationError:
                  summary: Cross-field payload rule violation
                  value:
                    error: CreateWorkOrderPayloadValidationError
                    message: Service "Brake Service" references unknown SKU "SKU-UNKNOWN"
        "409":
          description: Uniqueness conflict on customer document, vehicle plate, or part SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
              examples:
                duplicatePersonDocument:
                  summary: Existing customer document
                  value:
                    error: PersonDocumentAlreadyExists
                    message: Person with this document already exists
        "401":
          description: Unauthorized (missing or invalid JWT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedErrorResponse"
      security:
        - bearerAuth: []

