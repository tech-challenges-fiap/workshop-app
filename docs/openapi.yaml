                  $ref: "#/components/schemas/Person"
        "401":
          description: Unauthorized (missing or invalid JWT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedErrorResponse"
      security:
        - bearerAuth: []
  /person/{id}:
    get:
      tags:
        - People
      summary: Get person by ID
      operationId: getPersonById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Person found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: Validation error (Invalid ID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedErrorResponse"
      security:
        - bearerAuth: []

    put:
      tags:
        - People
      summary: Update person
      operationId: updatePerson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonRequest"
      responses:
        "200":
          description: Person updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: Body validation error or invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "409":
          description: Document already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedErrorResponse"
      security:
        - bearerAuth: []

    delete:
      tags:
        - People
      summary: Delete person
      operationId: deletePerson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Person successfully deleted
        "400":
          description: Validation error (Invalid ID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedErrorResponse"
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Stock items
    StockItem:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Internal stock item ID
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        unitOfMeasure:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int32
          minimum: 0
        price:
          type: number
          minimum: 0
          description: Unit price of the stock item (up to two decimal places)
      required:
        - sku
        - name
        - quantity
        - price

    CreateStockItemRequest:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int32
          minimum: 0
        unitOfMeasure:
          type: string
          nullable: true
        price:
          type: number
          minimum: 0
          description: Unit price of the stock item (up to two decimal places)
      required:
        - sku
        - name
        - quantity
        - price

    UpdateStockItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        unitOfMeasure:
          type: string
          nullable: true
        price:
          type: number
          minimum: 0
          description: Unit price of the stock item (up to two decimal places)
      additionalProperties: false

    StockItemQuantityChangeRequest:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
        - quantity

    # Services
    ServiceRequiredItem:
      type: object
      properties:
        stockItemId:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
        - stockItemId
        - quantity

    Service:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
        estimatedTime:
          type: integer
          format: int32
          minimum: 1
          description: Estimated time in minutes
        price:
          type: number
          minimum: 0
          description: Base service price (up to two decimal places)
        requiredItems:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequiredItem"
      required:
        - name
        - estimatedTime
        - price
        - requiredItems

    ServiceAverageDurationResponse:
      type: object
      properties:
        serviceId:
          type: integer
          format: int32
          minimum: 1
          description: Service identifier
        averageDurationSeconds:
          type: integer
          format: int64
          nullable: true
          description: Average duration in seconds of completed ServiceTasks
        taskCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of ServiceTasks considered in the calculation
        hasData:
          type: boolean
          description: Indicates whether there were completed ServiceTasks for calculation
      required:
        - serviceId
        - averageDurationSeconds
        - taskCount
        - hasData

    CreateOrUpdateServiceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        estimatedTime:
          type: integer
          format: int32
          minimum: 1
        price:
          type: number
          minimum: 0
          description: Base service price (up to two decimal places)
        requiredItems:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequiredItem"
          default: []
      required:
        - name
        - estimatedTime
        - price

    # Service Tasks
    ServiceTask:
      type: object
      properties:
        id:
          type: integer
          format: int32
          nullable: true
        serviceId:
          type: integer
          format: int32
        workOrderId:
          type: integer
          format: int32
          nullable: true
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
            - IN_EXECUTION
            - COMPLETED
            - CANCELED
        estimatedTime:
          type: integer
          format: int32
          minimum: 1
          description: Estimated time in minutes
        price:
          type: number
          minimum: 0
          description: Service price frozen in the task (up to two decimal places)
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - serviceId
        - status
        - estimatedTime
        - price

    CreateServiceTaskRequest:
      type: object
      properties:
        serviceId:
          type: integer
          format: int32
          minimum: 1
        workOrderId:
          type: integer
          format: int32
          minimum: 1
      required:
        - serviceId
        - workOrderId

    StartServiceExecutionRequest:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
          description: Optional; if omitted, the current server time is used.
      additionalProperties: false

    CompleteServiceTaskRequest:
      type: object
      properties:
        completedAt:
          type: string
          format: date-time
      additionalProperties: false

    # Work Orders
    CreateWorkOrderCustomerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        document:
          type: string
          minLength: 1
          description: CPF or CNPJ (formatted input accepted; normalized on persistence)
        phone:
          type: string
          minLength: 1
          description: Customer phone string (format is not strictly validated at API boundary)
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - customer
      required:
        - name
        - document
        - phone
        - email
        - role
      additionalProperties: false

    CreateWorkOrderVehicleRequest:
      type: object
      properties:
        plate:
          type: string
          minLength: 1
        brand:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        year:
          type: integer
          format: int32
          minimum: 1900
      required:
        - plate
        - brand
        - model
        - year
      additionalProperties: false

    CreateWorkOrderPartRequest:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int32
          minimum: 0
        unitOfMeasure:
          type: string
          nullable: true
        price:
          type: number
          minimum: 0
      required:
        - sku
        - name
        - quantity
        - price
      additionalProperties: false

    CreateWorkOrderServicePartReferenceRequest:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
        - sku
        - quantity
      additionalProperties: false

    CreateWorkOrderServiceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        estimatedTime:
          type: integer
          format: int32
          minimum: 1
        price:
          type: number
          minimum: 0
        requiredParts:
          type: array
          items:
            $ref: "#/components/schemas/CreateWorkOrderServicePartReferenceRequest"
          description: Optional list; defaults to an empty list when omitted.
          default: []
      required:
        - name
        - estimatedTime
        - price
      additionalProperties: false

    WorkOrderServiceTask:
      type: object
      properties:
        serviceTaskId:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
            - IN_EXECUTION
            - COMPLETED
            - CANCELED
        amount:
          type: number
          minimum: 0
          description: Service amount (up to two decimal places)
      required:
        - serviceTaskId
        - status
        - amount

    WorkOrder:
      type: object
      properties:
        id:
          type: integer
          format: int32
          nullable: true
        vehicleId:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - RECEIVED
            - DIAGNOSIS
            - WAITING_APPROVAL
            - READY
            - IN_EXECUTION
            - FINALIZED
            - DELIVERED
            - CANCELED
        totalAmount:
          type: number
          minimum: 0
          description: >-
            Total work order amount (up to two decimal places), including both
            the base value of services and the value of stock parts/items
            associated with service tasks currently billable
            (excluding REJECTED and CANCELED tasks).
        publicToken:
          type: string
        publicTokenExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        serviceTasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkOrderServiceTask"
      required:
        - vehicleId
        - status
        - totalAmount
        - publicToken
        - publicTokenExpiresAt
        - createdAt
        - updatedAt
        - serviceTasks

    CreateWorkOrderRequest:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/CreateWorkOrderCustomerRequest"
        vehicle:
          $ref: "#/components/schemas/CreateWorkOrderVehicleRequest"
        parts:
          type: array
          items:
            $ref: "#/components/schemas/CreateWorkOrderPartRequest"
          minItems: 1
        services:
          type: array
          items:
            $ref: "#/components/schemas/CreateWorkOrderServiceRequest"
          minItems: 1
      required:
        - customer
        - vehicle
        - parts
        - services
      additionalProperties: false

    WorkOrderStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - RECEIVED
            - DIAGNOSIS
            - WAITING_APPROVAL
            - IN_EXECUTION
            - FINALIZED
            - DELIVERED
            - CANCELED
      required:
        - status

    ExternalWebhookWorkOrderEventRequest:
      discriminator:
        propertyName: eventType
        mapping:
          SERVICE_TASK_APPROVED: "#/components/schemas/ExternalWebhookServiceTaskApprovedEventRequest"
          SERVICE_TASK_REJECTED: "#/components/schemas/ExternalWebhookServiceTaskRejectedEventRequest"
          WORK_ORDER_STATUS_UPDATED: "#/components/schemas/ExternalWebhookWorkOrderStatusUpdatedEventRequest"
      oneOf:
        - $ref: "#/components/schemas/ExternalWebhookServiceTaskApprovedEventRequest"
        - $ref: "#/components/schemas/ExternalWebhookServiceTaskRejectedEventRequest"
        - $ref: "#/components/schemas/ExternalWebhookWorkOrderStatusUpdatedEventRequest"

    ExternalWebhookServiceTaskApprovedEventRequest:
      type: object
      properties:
        eventId:
          type: string
          minLength: 1
        eventType:
          type: string
          enum:
            - SERVICE_TASK_APPROVED
        workOrderId:
          type: integer
          format: int32
          minimum: 1
        serviceTaskId:
          type: integer
          format: int32
          minimum: 1
        occurredAt:
          type: string
          format: date-time
      required:
        - eventId
        - eventType
        - workOrderId
        - serviceTaskId
      additionalProperties: false

    ExternalWebhookServiceTaskRejectedEventRequest:
      type: object
      properties:
        eventId:
          type: string
          minLength: 1
        eventType:
          type: string
          enum:
            - SERVICE_TASK_REJECTED
        workOrderId:
          type: integer
          format: int32
          minimum: 1
        serviceTaskId:
          type: integer
          format: int32
          minimum: 1
        occurredAt:
          type: string
          format: date-time
      required:
        - eventId
        - eventType
        - workOrderId
        - serviceTaskId
      additionalProperties: false

    ExternalWebhookWorkOrderStatusUpdatedEventRequest:
      type: object
      properties:
        eventId:
          type: string
          minLength: 1
        eventType:
          type: string
          enum:
            - WORK_ORDER_STATUS_UPDATED
        workOrderId:
          type: integer
          format: int32
          minimum: 1
        targetStatus:
          type: string
          enum:
            - DIAGNOSIS
            - WAITING_APPROVAL
            - IN_EXECUTION
            - FINALIZED
            - CANCELED
            - DELIVERED
        serviceTaskId:
          type: integer
          format: int32
          minimum: 1
          description: Required when `targetStatus` is `IN_EXECUTION` or `FINALIZED`.
        occurredAt:
          type: string
          format: date-time
      required:
        - eventId
        - eventType
        - workOrderId
        - targetStatus
      additionalProperties: false

    ExternalWebhookWorkOrderEventResponse:
      type: object
      properties:
        eventId:
          type: string
        eventType:
          type: string
          enum:
            - SERVICE_TASK_APPROVED
            - SERVICE_TASK_REJECTED
            - WORK_ORDER_STATUS_UPDATED
        result:
          type: string
          enum:
            - processed
            - duplicate
      required:
        - eventId
        - eventType
        - result

    # Vehicles
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          format: int32
          nullable: true
        plate:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
          minimum: 1900
        ownerPersonId:
          type: integer
          format: int32
      required:
        - plate
        - brand
        - model
        - year
        - ownerPersonId

    # People
    Person:
      type: object
      properties:
        id:
          type: integer
          format: int32
          nullable: true
        name:
          type: string
        document:
          type: string
        phone:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [customer, mecanic, front-desk]
      required:
        - name
        - document
        - phone
        - email
        - role

    CreatePersonRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        document:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum: [customer, mecanic, front-desk]
      required:
        - name
        - document
        - phone
        - email
        - role

    UpdatePersonRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        document:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum: [customer, mecanic, front-desk]
      additionalProperties: false

    CreateVehicleRequest:
      type: object
      properties:
        plate:
          type: string
          minLength: 1
        brand:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        year:
          type: integer
          format: int32
          minimum: 1900
        ownerPersonId:
          type: integer
          format: int32
          minimum: 1
      required:
        - plate
        - brand
        - model
        - year
        - ownerPersonId
      example:
        plate: ABC1D23
        brand: Fiat
        model: Fiat Uno
        year: 2015
        ownerPersonId: 1

    UpdateVehicleRequest:
      type: object
      properties:
        plate:
          type: string
          minLength: 1
        brand:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        year:
          type: integer
          format: int32
          minimum: 1900
        ownerPersonId:
          type: integer
          format: int32
          minimum: 1
      additionalProperties: false
      example:
        plate: ABC1D23
        brand: Fiat
        model: Fiat Uno Turbo
        year: 2018
        ownerPersonId: 2

    # Errors
    ValidationErrorResponse:
      type: object
      description: Input validation error (used in stock-items and services).
      properties:
        error:
          type: string
          description: Validation error identifier.
          example: ValidationError
        details:
          type: array
          description: List of validation errors (ZodIssue)
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string
              code:
                type: string
            additionalProperties: true
      required:
        - error
        - details

    VehicleValidationErrorResponse:
      type: object
      description: Validation error specific to vehicle routes.
      properties:
        error:
          type: string
          description: Short validation error message.
          example: Validation failed
        details:
          type: array
          description: List of validation errors (ZodIssue)
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string
              code:
                type: string
            additionalProperties: true
      required:
        - error
        - details

    DomainErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Domain error name
          example: SkuAlreadyExists
        message:
          type: string
          example: Stock item with this SKU already exists
      required:
        - error
        - message

    UnexpectedErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: UnexpectedError
        message:
          type: string
      required:
        - error
        - message

    SimpleErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AuthLoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - username
        - password

    AuthLoginResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token
