services:
  app:
    build:
      context: .
      target: dev
    container_name: workshop_app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workshop-net
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response)=>{if(!response.ok)process.exit(1);}).catch(()=>process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
      - ./scripts:/app/scripts
      - ./Dockerfile:/app/Dockerfile:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./eslint.config.cjs:/app/eslint.config.cjs
      - ./.dependency-cruiser.cjs:/app/.dependency-cruiser.cjs:ro
      - ./.prettierrc:/app/.prettierrc
      - ./.prettierignore:/app/.prettierignore

  postgres:
    image: postgres:16-alpine
    container_name: workshop_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - workshop-net

  nginx:
    image: nginx:alpine
    container_name: workshop_nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - workshop-net

networks:
  workshop-net:
    driver: bridge

volumes:
  postgres-data:
