apiVersion: batch/v1
kind: Job
metadata:
  name: workshop-app-migrations
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workshop-app
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: workshop-app
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - run
            - dist/src/infrastructure/db/migrate.js
          envFrom:
            - configMapRef:
                name: workshop-app-config
            - secretRef:
                name: workshop-app-secret
